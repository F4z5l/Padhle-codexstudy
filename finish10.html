<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080a0f">
<title>Finish Class Xth Crash Course — CODEX STUDYS</title>
<link rel="icon" href="assets/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>(function(){var t=localStorage.getItem("codex-studys-theme");if(t&&t!=="system")document.documentElement.setAttribute("data-theme",t);})();</script>
<style>
    :root {
      --bg: #080a0f;
      --bg-raised: #0d1017;
      --panel: rgba(17, 21, 31, .82);
      --panel-solid: #11151f;
      --panel-soft: #151b27;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .16);
      --text: #f4f6fb;
      --muted: #8d96a8;
      --muted-bright: #b4bdcd;
      --brand: #8b7cff;
      --brand-bright: #a69cff;
      --mint: #55ddbb;
      --orange: #ffb36b;
      --danger: #ff7585;
      --shadow: 0 24px 70px rgba(0, 0, 0, .32);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 11px;
      --max: 1240px;
    }

    html[data-theme="light"] {
      --bg: #f4f5f9; --bg-raised: #ffffff; --panel: rgba(255,255,255,.86); --panel-solid: #ffffff; --panel-soft: #eef0f6;
      --line: rgba(20,22,35,.1); --line-strong: rgba(20,22,35,.18); --text: #14161f; --muted: #5b6072; --muted-bright: #383c4a;
      --brand: #6c5ce7; --brand-bright: #5b46e0; --mint: #12b899; --orange: #d9832a; --danger: #e0344f;
      --shadow: 0 24px 70px rgba(30,30,60,.14);
    }
    html[data-theme="sandalwood"] {
      --bg: #1c130c; --bg-raised: #241a10; --panel: rgba(43,31,20,.82); --panel-solid: #2b1f14; --panel-soft: #332417;
      --line: rgba(255,225,190,.1); --line-strong: rgba(255,225,190,.18); --text: #f6ead9; --muted: #b89a7c; --muted-bright: #d9c1a3;
      --brand: #cd8a4a; --brand-bright: #e6a75f; --mint: #b58a4f; --orange: #ff9d4d; --danger: #ff7c6b;
    }
    html[data-theme="forest-emerald"] {
      --bg: #06140f; --bg-raised: #0a1c15; --panel: rgba(12,32,24,.82); --panel-solid: #0e2318; --panel-soft: #122a1d;
      --line: rgba(180,255,220,.09); --line-strong: rgba(180,255,220,.17); --text: #eafff3; --muted: #83b39c; --muted-bright: #aed7c1;
      --brand: #2fbf7a; --brand-bright: #3fdd91; --mint: #55ddbb; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="ocean-deep"] {
      --bg: #050e17; --bg-raised: #081521; --panel: rgba(11,26,40,.82); --panel-solid: #0c1e2e; --panel-soft: #102636;
      --line: rgba(170,225,255,.09); --line-strong: rgba(170,225,255,.17); --text: #eaf6ff; --muted: #7ea3bd; --muted-bright: #a9cbe0;
      --brand: #2196e0; --brand-bright: #4db4ff; --mint: #2fd3c7; --orange: #ffb36b; --danger: #ff7585;
    }
    html[data-theme="sakura-blossom"] {
      --bg: #fff3f6; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ffe4ec;
      --line: rgba(180,40,80,.1); --line-strong: rgba(180,40,80,.18); --text: #3c1420; --muted: #a26478; --muted-bright: #7a3a4c;
      --brand: #ec6f96; --brand-bright: #e14f7e; --mint: #16b39a; --orange: #e08a3c; --danger: #d9314f;
    }
    html[data-theme="dracula-midnight"] {
      --bg: #14121f; --bg-raised: #1b1830; --panel: rgba(38,33,64,.82); --panel-solid: #241f3d; --panel-soft: #2b2549;
      --line: rgba(220,200,255,.09); --line-strong: rgba(220,200,255,.17); --text: #f3ecff; --muted: #a08fc9; --muted-bright: #c6b7ea;
      --brand: #bd93f9; --brand-bright: #d6acff; --mint: #50fa7b; --orange: #ffb86c; --danger: #ff5555;
    }
    html[data-theme="lavender-mist"] {
      --bg: #f5f2fc; --bg-raised: #ffffff; --panel: rgba(255,255,255,.88); --panel-solid: #ffffff; --panel-soft: #ece5fb;
      --line: rgba(80,50,140,.1); --line-strong: rgba(80,50,140,.18); --text: #2c2140; --muted: #7a6a9c; --muted-bright: #4d3d70;
      --brand: #9b7be0; --brand-bright: #855fdb; --mint: #16b39a; --orange: #d9832a; --danger: #d9314f;
    }
    html[data-theme="cyberpunk-neon"] {
      --bg: #05020a; --bg-raised: #0a0512; --panel: rgba(20,8,32,.85); --panel-solid: #150a22; --panel-soft: #1c0e2c;
      --line: rgba(255,60,220,.16); --line-strong: rgba(255,60,220,.3); --text: #f2e9ff; --muted: #b48ad9; --muted-bright: #e2b8ff;
      --brand: #ff2ec4; --brand-bright: #ff5be0; --mint: #2af5ff; --orange: #ffb36b; --danger: #ff3860;
    }
* { box-sizing: border-box; }
body { margin:0; min-width:320px; background: radial-gradient(circle at 78% 3%, rgba(139,124,255,.12), transparent 30rem), var(--bg); color:var(--text); font:15px/1.55 "DM Sans", sans-serif; -webkit-font-smoothing:antialiased; }
h1,h2,h3 { font-family:"Space Grotesk","DM Sans",sans-serif; margin:0; }
button { font:inherit; color:inherit; cursor:pointer; }
.topbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--panel); backdrop-filter:blur(16px); border-bottom:1px solid var(--line); }
.icon-btn { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; border:1px solid var(--line); background:var(--panel-soft); flex:none; }
.icon-btn svg { width:18px; height:18px; }
.topbar h2 { font-size:15px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.wrap { max-width:860px; margin:0 auto; padding:16px; }
.hero { border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; background:var(--panel); box-shadow:var(--shadow); margin-bottom:18px; }
.hero-body { padding:18px 16px; text-align:center; }
.hero-body h1 { font-size:20px; line-height:1.3; }
.hero-body p { margin:8px 0 0; color:var(--muted-bright); font-size:13px; }
.chips { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:14px; }
.chip { padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted-bright); background:rgba(255,255,255,.03); font-size:11px; font-weight:700; }
.chip-accent { color:var(--brand-bright); border-color:rgba(139,124,255,.35); background:rgba(139,124,255,.1); }
.group-head { display:flex; align-items:center; gap:10px; margin:20px 0 10px; }
.group-head .ico { width:32px; height:32px; border-radius:10px; background:rgba(139,124,255,.14); color:var(--brand-bright); display:grid; place-items:center; font-size:15px; }
.group-head h3 { font-size:14px; font-weight:700; color:var(--muted-bright); }
.row { display:flex; align-items:center; gap:12px; padding:14px; margin-bottom:10px; border:1px solid var(--line); border-radius:var(--radius-md); background:var(--panel); cursor:pointer; transition:transform .2s, border-color .2s; }
.row:hover { transform:translateY(-2px); border-color:rgba(166,156,255,.42); }
.row-ico { width:38px; height:38px; flex:none; display:grid; place-items:center; border-radius:11px; background:rgba(139,124,255,.12); color:var(--brand-bright); }
.row-ico svg { width:18px; height:18px; }
.row-info { flex:1; min-width:0; }
.row-title { font-weight:700; font-size:14px; line-height:1.35; }
.row-sub { color:var(--muted); font-size:12px; margin-top:2px; }
.row-arrow { color:var(--muted); flex:none; }
.progress-track { width:100%; height:4px; border-radius:999px; background:var(--line); margin-top:8px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(135deg,#9487ff,#6c5bed); border-radius:999px; }
.player { position:fixed; inset:0; z-index:100; display:none; flex-direction:column; background:#000; }
.player.open { display:flex; }
.player-head { display:flex; align-items:center; gap:12px; padding:10px 14px; background:var(--panel-solid); border-bottom:1px solid var(--line); }
.player-head h3 { font-size:14px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.stage { flex:1; position:relative; background:#000; min-height:0; }
.stage iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:#000; }
.footnote { text-align:center; color:var(--muted); font-size:12px; margin-top:18px; }
</style>
</head>
<body>
<header class="topbar">
  <a class="icon-btn" href="index.html" aria-label="Back to batches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg></a>
  <h2>Finish Class Xth Crash Course</h2>
</header>
<main class="wrap">
  <section class="hero">
    <div class="hero-body">
      <h1>Finish Class Xth In A "24:00:00 HOURS" Crash Course</h1>
      <p>Full syllabus, subject-wise resources shared on Telegram.</p>
      <div class="chips">
        <span class="chip chip-accent">₹499</span>
        <span class="chip">Limited Seats</span>
        <span class="chip">Hinglish</span>
      </div>
    </div>
  </section>
  <div id="groups"></div>
  <p class="footnote">Powered By CODEX STUDYS</p>
</main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v = "") => String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[c]));
const ICON_TG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.2 18.7 19.8c-.2 1-1 1.3-1.9.8l-5.3-3.9-2.6 2.5c-.3.3-.5.5-1 .5l.4-5.3L18 6.5c.5-.4 0-.6-.6-.2L7 12.9l-5.2-1.6c-1.1-.3-1.1-1.1.2-1.6l20.2-7.8c.9-.3 1.7.2 1.4 1.6Z"/></svg>';
const ICON_FOLDER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg>';
const ARROW = '<svg class="row-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="9 18 15 12 9 6"/></svg>';

const GROUPS = [
  { id: "chemistry", name: "Chemistry", resources: [
    { title: "Chemistry Part 1", url: "https://t.me/Codexstuddys_bot/1922" },
    { title: "Chemistry Part 2", url: "https://t.me/Codexstuddys_bot/1923" }
  ] },
  { id: "biology", name: "Biology", resources: [
    { title: "Biology", url: "https://t.me/Codexstuddys_bot/1925" }
  ] },
  { id: "physics", name: "Physics", resources: [
    { title: "Physics", url: "https://t.me/Codexstuddys_bot/1927" }
  ] },
  { id: "maths", name: "Mathematics", resources: [
    { title: "Mathematics Part 1", url: "https://t.me/Codexstuddys_bot/1929" },
    { title: "Mathematics Part 2", url: "https://t.me/Codexstuddys_bot/1930" },
    { title: "Mathematics Part 3", url: "https://t.me/Codexstuddys_bot/1931" }
  ] },
  { id: "social", name: "Social Science", resources: [
    { title: "History", url: "https://t.me/Codexstuddys_bot/1933" },
    { title: "Civics / Political Science", url: "https://t.me/Codexstuddys_bot/1935" },
    { title: "Geography", url: "https://t.me/Codexstuddys_bot/1937" },
    { title: "Economics", url: "https://t.me/Codexstuddys_bot/1939" }
  ] }
];

let openGroup = null;

function renderGroups() {
  openGroup = null;
  const el = $("#groups");
  el.innerHTML = GROUPS.map((g, i) => `
    <div class="row" data-group="${i}">
      <div class="row-ico">${ICON_FOLDER}</div>
      <div class="row-info"><div class="row-title">${esc(g.name)}</div><div class="row-sub">${g.resources.length} resource${g.resources.length === 1 ? "" : "s"}</div></div>${ARROW}
    </div>`).join("");
  el.querySelectorAll(".row").forEach((r) => r.addEventListener("click", () => renderResources(Number(r.dataset.group))));
}

function renderResources(i) {
  openGroup = i;
  const g = GROUPS[i];
  const el = $("#groups");
  el.innerHTML = `<div class="row" id="backRow"><div class="row-ico">${ARROW.replace('row-arrow','row-arrow" style="transform:rotate(180deg)')}</div><div class="row-info"><div class="row-title">Back to subjects</div></div></div>` +
    g.resources.map((r) => `
    <a class="row" href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">
      <div class="row-ico">${ICON_TG}</div>
      <div class="row-info"><div class="row-title">${esc(r.title)}</div><div class="row-sub">Open on Telegram</div></div>${ARROW}
    </a>`).join("");
  $("#backRow").addEventListener("click", renderGroups);
  window.scrollTo({ top: 0 });
}

renderGroups();
</script>
</body>
</html>
